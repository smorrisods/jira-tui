[package]
name = "jira-tui"
version = "0.10.0"
edition = "2021"
description = "A developer-first, keyboard-driven Jira terminal UI with a little bit of soul."
license = "MIT"
authors = ["Scott Morris"]
repository = "https://github.com/smorrisods/jira-tui"
homepage = "https://github.com/smorrisods/jira-tui"
documentation = "https://github.com/smorrisods/jira-tui#readme"
rust-version = "1.87"
build = "build.rs"

[features]
default = ["live"]
# `live` pulls in the HTTP stack for talking to real Jira. Disable it
# (`--no-default-features`) for a pure offline / demo build.
live = ["ureq", "dep:rusqlite"]
# `mcp` adds the `jira-mcp` binary: a Model Context Protocol server that lets
# agents read and write Jira issues. Implies `live` (a Jira MCP server with
# no way to reach Jira isn't useful).
mcp = ["live", "dep:rmcp", "dep:schemars"]
# `images` renders attachment thumbnails/previews in the terminal (Kitty/
# Sixel/iTerm2 protocols, with a Unicode half-block fallback) via
# `ratatui-image`. Optional because not every terminal supports any of
# those protocols and the crate's transitive `image` decoder pulls in a
# non-trivial dependency tree — `default` and `--no-default-features` stay
# free of it. See issue #130.
images = ["dep:ratatui-image", "dep:image"]

[dependencies]
ratatui = "0.30"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json", "tls"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
rmcp = { version = "3", features = ["server", "transport-io", "schemars"], optional = true }
# Required by the main `jira-tui` binary's async run loop (see src/main.rs)
# as well as the `jira-mcp` binary (gated behind the `mcp` feature).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
schemars = { version = "1", optional = true }
toml_edit = "0.25.12"
tokio-stream = "0.1.18"
# Pure-Rust, no-FFI spell checking for the built-in editor — offline-only,
# no system dependency, so it works the same in every feature set. Chosen
# over the (also pure-Rust) `zspell` for its much smaller dependency
# footprint (just `hashbrown`/`foldhash` vs. `regex`, `dirs`, `itertools`,
# `sys-locale`, etc.). See `src/spellcheck.rs` and `assets/dictionaries/en`
# for the bundled dictionary.
spellbook = "0.4"
# Terminal image rendering for the attachment picker preview (`images`
# feature — see issue #130): Kitty/Sixel/iTerm2 graphics protocols with a
# Unicode half-block fallback, picked at runtime via capability detection.
ratatui-image = { version = "11", optional = true, default-features = false, features = ["crossterm"] }
# Image decoding backing `ratatui-image`'s previews. Not redundant with
# `ratatui-image`'s own `image` dependency: that crate only requests the
# `png` decoder for itself (`default-features = false, features = ["png"]`
# in its own Cargo.toml) — cargo's feature unification takes the union
# across every dependent, so this crate's explicit jpeg/gif/webp additions
# are what actually puts those decoders in the binary, confirmed via
# `cargo tree --features images -e features -i image`.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
# Only needed to `raise(SIGTSTP)` for the Ctrl+Z suspend-to-shell flow (see
# `src/suspend.rs`); there's no POSIX job control to hook into on Windows.
libc = "0.2"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"

[[bin]]
name = "jira-tui"
path = "src/main.rs"

[[bin]]
name = "jira-mcp"
path = "src/bin/jira_mcp.rs"
required-features = ["mcp"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[dev-dependencies]
mockito = "1.7.2"
